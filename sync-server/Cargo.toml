[package]
name = "yebian-sync-server"
version = "0.1.0"
edition = "2021"
description = "Yebian sync relay: append-only encrypted op log and content-addressed blob store"
license = "MIT"

[lib]
name = "yebian_sync_server"
path = "src/lib.rs"

[[bin]]
name = "yebian-sync-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
