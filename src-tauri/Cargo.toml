[package]
name = "yebian"
version = "0.1.0"
description = "Yebian: a local-first notes reader and annotation workspace"
authors = ["Yebian"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "yebian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
notify = "8"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "fs", "process", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures-util = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
